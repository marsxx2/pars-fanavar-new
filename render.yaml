services:
  - type: web
    name: pars-fanavar-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_API_KEY
        sync: false
    disk:
      name: pars-fanavar-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
